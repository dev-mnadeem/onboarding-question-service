[project]
name = "limitless-horizon"
version = "0.1.0"
description = "Onboarding questionnaire service: steps, answers and review"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.1,<7.0",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.0",
    "django-cors-headers>=4.9.0",
    "django-jazzmin>=3.0.0",
    "drf-yasg>=1.21.0",
    "python-dotenv>=1.2.3",
    "whitenoise>=6.8.0",
]

[project.optional-dependencies]
# Linting and formatting only; the test suite runs on Django's own runner.
dev = ["ruff>=0.14.0"]
# MySQL needs a C client library on the host, so it is opt-in. SQLite is the
# default and is what the test suite uses.
mysql = ["mysqlclient>=2.2.0"]
# What the container image installs on top of the base dependencies.
prod = ["gunicorn>=23.0.0", "mysqlclient>=2.2.0"]

[tool.uv]
# This is an application, not a library: never install it into its own venv.
package = false

[tool.ruff]
# Assume Python 3.12
target-version = "py312"
# Same as Black.
line-length = 88
indent-width = 4

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EM",     # flake8-errmsg
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PD",     # pandas-vet
    "PGH",    # pygrep-hooks
    "PL",     # Pylint
    "TRY",    # tryceratops
    "NPY",    # NumPy-specific rules
    "PERF",   # Perflint
    "FBT",    # flake8-boolean-trap
    "FA",     # Future annotations
    "LOG",    # flake8-logging-format
    "RUF",    # Ruff-specific rules
]

ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Do not perform function calls in argument defaults
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value used in comparison
    "PLC0415", # Import should be at top-level (Django manage.py pattern)
    "TRY003", # Avoid specifying long messages outside exception class (Django pattern)
    "EM101",  # Exception must not use string literal (Django pattern)
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "**/migrations/**",
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["backend", "user"]

[tool.ruff.lint.per-file-ignores]
# The suite runs on Django's unittest runner, not pytest, and tests are
# allowed magic values and plain asserts.
"tests/**/*.py" = [
    "PLR2004",
    "S101",
    "ARG",
    "FBT",
    "PT009",   # unittest-style assertions are the runner's own API
    "PT027",   # ...including assertRaises
]
# Allow relative imports in migrations
"**/migrations/**/*.py" = [
    "TID252",
    "RUF012",  # Mutable class attributes (Django migration pattern)
]

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 20
max-returns = 10
max-statements = 100

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"

[tool.ruff.lint.flake8-import-conventions]
aliases = { "django" = "django" }

